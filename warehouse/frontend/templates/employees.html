{% extends "base.html" %}
{% block title %}Empleados — WMS Almacén{% endblock %}
{% block page_title %}Empleados{% endblock %}

{% block content %}
<div x-data="employeesData()" x-init="init()">

  <!-- Tabs -->
  <div class="flex gap-1 mb-6 bg-white border border-gray-200 rounded-lg p-1 w-fit">
    <button @click="setTab('staff')" :class="tab==='staff' ? 'bg-blue-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'"
            class="px-4 py-1.5 rounded-md text-sm font-medium transition-all">Personal</button>
    <button @click="setTab('payroll')" :class="tab==='payroll' ? 'bg-blue-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'"
            class="px-4 py-1.5 rounded-md text-sm font-medium transition-all">Nóminas</button>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex justify-center py-12"><div class="spinner"></div></div>

  <!-- ===================== STAFF TAB ===================== -->
  <div x-show="!loading && tab === 'staff'">
    <div class="flex flex-wrap items-center gap-3 mb-5">
      <div class="relative flex-1 min-w-[200px]">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="search" class="form-input pl-10" placeholder="Buscar empleado…" x-model="search" @input.debounce.300ms="fetchEmployees()">
      </div>
      <select class="form-input w-auto" x-model="filterDept" @change="fetchEmployees()">
        <option value="">Todos los departamentos</option>
        <template x-for="dept in departments" :key="dept"><option :value="dept" x-text="dept"></option></template>
      </select>
      <button @click="openEmployeeModal()" class="flex items-center gap-2 px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold rounded-lg transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Nuevo Empleado
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-if="!employees.length">
        <div class="card text-center py-12 text-gray-400 col-span-full">No se encontraron empleados</div>
      </template>
      <template x-for="emp in employees" :key="emp.id">
        <div class="card card-hover">
          <div class="flex items-start gap-3 mb-3">
            <div class="w-12 h-12 rounded-full bg-blue-700 text-white flex items-center justify-center text-lg font-bold flex-shrink-0"
                 x-text="(emp.first_name?.[0]||'') + (emp.last_name?.[0]||'')"></div>
            <div class="flex-1 min-w-0">
              <p class="font-bold text-gray-900 truncate" x-text="emp.full_name || emp.first_name + ' ' + emp.last_name"></p>
              <p class="text-sm text-gray-600" x-text="emp.position || '—'"></p>
              <span x-html="statusBadge(emp.status || 'active')"></span>
            </div>
          </div>
          <div class="space-y-1.5 text-sm border-t border-gray-100 pt-3">
            <div class="flex items-center gap-2 text-gray-600">
              <svg class="w-4 h-4 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              <span class="truncate" x-text="emp.email || '—'"></span>
            </div>
            <div class="flex items-center gap-2 text-gray-600">
              <svg class="w-4 h-4 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              <span x-text="emp.phone || '—'"></span>
            </div>
            <div class="flex items-center gap-2 text-gray-600">
              <svg class="w-4 h-4 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
              <span x-text="emp.department || '—'"></span>
            </div>
            <div class="flex items-center gap-2 text-gray-600">
              <svg class="w-4 h-4 text-gray-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span x-text="formatCurrency(emp.salary || 0) + ' / mes'"></span>
            </div>
          </div>
          <div class="flex gap-2 mt-4">
            <button @click="editEmployee(emp)" class="flex-1 py-2 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg">Editar</button>
            <button @click="deleteEmployee(emp.id)" class="px-3 py-2 text-xs font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded-lg">Eliminar</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===================== PAYROLL TAB ===================== -->
  <div x-show="!loading && tab === 'payroll'">
    <div class="flex flex-wrap items-center gap-3 mb-5">
      <select class="form-input w-auto" x-model="payrollMonth" @change="fetchPayrolls()">
        <template x-for="m in months" :key="m.value">
          <option :value="m.value" x-text="m.label"></option>
        </template>
      </select>
      <select class="form-input w-auto" x-model="payrollYear" @change="fetchPayrolls()">
        <template x-for="y in years" :key="y"><option :value="y" x-text="y"></option></template>
      </select>
      <div class="ml-auto text-sm text-gray-500">
        Total nóminas: <span class="font-semibold text-gray-800" x-text="formatCurrency(payrollTotal)"></span>
      </div>
    </div>

    <div class="card p-0 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Empleado</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide hidden md:table-cell">Departamento</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Salario base</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide hidden sm:table-cell">Extras</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Total</th>
              <th class="text-center px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Estado</th>
              <th class="text-center px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-if="!payrollRows.length">
              <tr><td colspan="7" class="py-12 text-center text-gray-400">No hay datos de nóminas para este período</td></tr>
            </template>
            <template x-for="row in payrollRows" :key="row.employee_id">
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-blue-700 text-white flex items-center justify-center text-xs font-bold flex-shrink-0"
                         x-text="(row.first_name?.[0]||'') + (row.last_name?.[0]||'')"></div>
                    <div>
                      <p class="font-medium text-gray-800" x-text="row.full_name"></p>
                      <p class="text-xs text-gray-500" x-text="row.position"></p>
                    </div>
                  </div>
                </td>
                <td class="px-4 py-3 text-gray-600 hidden md:table-cell" x-text="row.department || '—'"></td>
                <td class="px-4 py-3 text-right font-medium text-gray-800" x-text="formatCurrency(row.base_salary || 0)"></td>
                <td class="px-4 py-3 text-right text-green-700 hidden sm:table-cell" x-text="row.extras > 0 ? '+' + formatCurrency(row.extras) : '—'"></td>
                <td class="px-4 py-3 text-right font-bold text-gray-900" x-text="formatCurrency((row.base_salary||0) + (row.extras||0))"></td>
                <td class="px-4 py-3 text-center">
                  <span x-show="!row.payroll_id" class="badge badge-draft">Sin generar</span>
                  <span x-show="row.payroll_id && row.payroll_status === 'generated'" class="badge badge-picking">Generada</span>
                  <span x-show="row.payroll_status === 'paid'" class="badge badge-completed">Pagada</span>
                </td>
                <td class="px-4 py-3 text-center">
                  <div class="flex items-center justify-center gap-1.5 flex-wrap">
                    <button x-show="!row.payroll_id" @click="generatePayroll(row)"
                            class="px-2 py-1 text-xs font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 rounded transition-colors">
                      Generar
                    </button>
                    <button x-show="row.payroll_id && row.payroll_status !== 'paid'" @click="markPaid(row)"
                            class="px-2 py-1 text-xs font-medium text-green-700 bg-green-50 hover:bg-green-100 rounded transition-colors">
                      Marcar Pagada
                    </button>
                    <button x-show="row.payroll_id" @click="printPayslip(row)"
                            class="px-2 py-1 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                      <svg class="w-3.5 h-3.5 inline mr-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                      Imprimir
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
          <tfoot class="bg-gray-50 border-t border-gray-200" x-show="payrollRows.length > 0">
            <tr>
              <td colspan="4" class="px-4 py-3 font-semibold text-gray-700 text-right hidden sm:table-cell">Total del mes:</td>
              <td colspan="4" class="px-4 py-3 font-semibold text-gray-700 sm:hidden">Total:</td>
              <td class="px-4 py-3 text-right font-bold text-gray-900 text-base" x-text="formatCurrency(payrollTotal)"></td>
              <td colspan="2"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: Employee ===== -->
  <div x-show="showEmployeeModal" class="modal-backdrop" @click.self="showEmployeeModal=false" style="display:none;">
    <div class="modal-box max-w-lg w-full" x-transition>
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <h2 class="text-lg font-semibold" x-text="editEmployeeId ? 'Editar Empleado' : 'Nuevo Empleado'"></h2>
        <button @click="showEmployeeModal=false" class="text-gray-400 hover:text-gray-600"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <form @submit.prevent="saveEmployee()" class="px-6 py-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-input" x-model="empForm.first_name" placeholder="Nombre" required>
          </div>
          <div>
            <label class="form-label">Apellidos *</label>
            <input type="text" class="form-input" x-model="empForm.last_name" placeholder="Apellidos" required>
          </div>
        </div>
        <div>
          <label class="form-label">Email</label>
          <input type="email" class="form-input" x-model="empForm.email" placeholder="empleado@empresa.com">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-input" x-model="empForm.phone" placeholder="+34 600 000 000">
          </div>
          <div>
            <label class="form-label">DNI / NIF</label>
            <input type="text" class="form-input" x-model="empForm.dni" placeholder="12345678A">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Cargo / Puesto</label>
            <input type="text" class="form-input" x-model="empForm.position" placeholder="Ej: Operario almacén">
          </div>
          <div>
            <label class="form-label">Departamento</label>
            <input type="text" class="form-input" x-model="empForm.department" placeholder="Ej: Almacén" list="depts-list">
            <datalist id="depts-list">
              <template x-for="d in departments" :key="d"><option :value="d"></option></template>
            </datalist>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Salario bruto/mes (€)</label>
            <input type="number" class="form-input" x-model.number="empForm.salary" min="0" step="0.01" placeholder="0.00">
          </div>
          <div>
            <label class="form-label">Fecha de alta</label>
            <input type="date" class="form-input" x-model="empForm.hire_date">
          </div>
        </div>
        <div>
          <label class="form-label">Estado</label>
          <select class="form-input" x-model="empForm.status">
            <option value="active">Activo</option>
            <option value="inactive">Inactivo / Baja</option>
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" @click="showEmployeeModal=false" class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
          <button type="submit" :disabled="submitting" class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 rounded-lg disabled:opacity-60 flex items-center justify-center gap-2">
            <div x-show="submitting" class="spinner spinner-sm border-white border-t-transparent"></div>
            <span x-text="editEmployeeId ? 'Guardar cambios' : 'Crear empleado'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function employeesData() {
  return {
    loading: true, submitting: false, tab: 'staff',
    employees: [], departments: [], payrollRows: [],
    search: '', filterDept: '',
    showEmployeeModal: false, editEmployeeId: null,
    empForm: { first_name:'', last_name:'', email:'', phone:'', dni:'', position:'', department:'', salary:0, hire_date:'', status:'active' },
    payrollMonth: new Date().getMonth()+1,
    payrollYear: new Date().getFullYear(),

    get months() {
      return [{value:1,label:'Enero'},{value:2,label:'Febrero'},{value:3,label:'Marzo'},{value:4,label:'Abril'},{value:5,label:'Mayo'},{value:6,label:'Junio'},{value:7,label:'Julio'},{value:8,label:'Agosto'},{value:9,label:'Septiembre'},{value:10,label:'Octubre'},{value:11,label:'Noviembre'},{value:12,label:'Diciembre'}];
    },
    get years() {
      const y=new Date().getFullYear(); return [y-2,y-1,y,y+1];
    },
    get payrollTotal() {
      return this.payrollRows.reduce((s,r)=>s+(r.base_salary||0)+(r.extras||0),0);
    },

    async init() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('tab')) this.tab = params.get('tab');
      this.loading = true;
      await Promise.all([this.fetchEmployees(), this.fetchDepartments()]);
      if (this.tab === 'payroll') await this.fetchPayrolls();
      this.loading = false;
    },

    setTab(t) {
      this.tab = t; this.loading = true;
      Promise.all([this.fetchEmployees(), t==='payroll' ? this.fetchPayrolls() : Promise.resolve()]).then(()=>this.loading=false);
    },

    async fetchEmployees() {
      try {
        const data = await api('GET', '/employees');
        const needle = this.search.toLowerCase();
        this.employees = (data.items || data || [])
          .map(e => this.normalizeEmployee(e))
          .filter(e => !needle || [e.full_name, e.email, e.department].some(v => String(v || '').toLowerCase().includes(needle)))
          .filter(e => !this.filterDept || e.department === this.filterDept);
        this.fetchDepartments();
      } catch (_) {}
    },
    async fetchDepartments() {
      this.departments = [...new Set(this.employees.map(e => e.department).filter(Boolean))].sort();
    },
    async fetchPayrolls() {
      try {
        if (!this.employees.length) await this.fetchEmployees();
        const data = await api('GET', `/employees/payrolls/report/${this.payrollYear}/${this.payrollMonth}`);
        const payrolls = data.items || data || [];
        const byEmployee = new Map(payrolls.map(p => [p.employee_id, p]));
        this.payrollRows = this.employees.map(emp => {
          const payroll = byEmployee.get(emp.id);
          return {
            employee_id: emp.id,
            first_name: emp.first_name,
            last_name: emp.last_name,
            full_name: emp.full_name,
            department: emp.department,
            base_salary: payroll?.salary_base ?? emp.salary,
            extras: payroll?.bonuses ?? 0,
            deductions: payroll?.deductions ?? 0,
            payroll_id: payroll?.id,
            payroll_status: payroll ? statusKey(payroll.status) === 'paid' ? 'paid' : 'generated' : null,
          };
        });
      } catch (_) {}
    },

    normalizeEmployee(e) {
      return {
        ...e,
        first_name: e.first_name || e.name || '',
        last_name: e.last_name || e.surname || '',
        full_name: e.full_name || `${e.name || ''} ${e.surname || ''}`.trim(),
        salary: e.salary ?? e.salary_base ?? 0,
        status: e.status || (e.is_active === false ? 'inactive' : 'active'),
      };
    },
    employeePayload() {
      const payload = {
        name: this.empForm.first_name,
        surname: this.empForm.last_name,
        phone: this.empForm.phone || null,
        position: this.empForm.position || null,
        department: this.empForm.department || null,
        hire_date: this.empForm.hire_date || null,
        salary_base: this.empForm.salary || 0,
        is_active: this.empForm.status !== 'inactive',
      };
      if (!this.editEmployeeId) {
        payload.employee_number = `EMP-${Date.now()}`;
        payload.dni = this.empForm.dni || `DNI-${Date.now()}`;
        payload.email = this.empForm.email;
        payload.role = 'PICKER';
        payload.password = 'admin123';
      }
      return payload;
    },

    openEmployeeModal() { this.editEmployeeId=null; this.empForm={first_name:'',last_name:'',email:'',phone:'',dni:'',position:'',department:'',salary:0,hire_date:'',status:'active'}; this.showEmployeeModal=true; },
    editEmployee(e) { this.editEmployeeId=e.id; this.empForm={first_name:e.first_name||'',last_name:e.last_name||'',email:e.email||'',phone:e.phone||'',dni:e.dni||'',position:e.position||'',department:e.department||'',salary:e.salary||0,hire_date:e.hire_date||'',status:e.status||'active'}; this.showEmployeeModal=true; },
    async saveEmployee() {
      if(this.submitting)return; this.submitting=true;
      try {
        const payload = this.employeePayload();
        if(this.editEmployeeId){await api('PUT',`/employees/${this.editEmployeeId}`,payload);toast('Empleado actualizado','success');}
        else{await api('POST','/employees',payload);toast('Empleado creado','success');}
        this.showEmployeeModal=false; await this.fetchEmployees(); await this.fetchDepartments();
      }catch(_){}finally{this.submitting=false;}
    },
    async deleteEmployee(id) {
      if(!await confirmDialog('¿Eliminar este empleado?'))return;
      try{await api('PUT',`/employees/${id}`,{is_active:false});toast('Empleado desactivado','success');await this.fetchEmployees();}catch(_){}
    },
    async generatePayroll(row) {
      try{
        await api('POST',`/employees/${row.employee_id}/payrolls`,{employee_id:row.employee_id,month:this.payrollMonth,year:this.payrollYear,salary_base:row.base_salary||0,bonuses:row.extras||0,deductions:row.deductions||0});
        toast('Nómina generada','success'); await this.fetchPayrolls();
      }catch(_){}
    },
    async markPaid(row) {
      if(!row.payroll_id)return;
      try{await api('PUT',`/employees/payrolls/${row.payroll_id}/pay`);toast('Nómina marcada como pagada','success');await this.fetchPayrolls();}catch(_){}
    },
    printPayslip(row) {
      if(!row.payroll_id)return;
      toast('Impresion de nomina pendiente de endpoint backend', 'info');
    },

    statusBadge:(s)=>statusBadge(s),
    formatCurrency:(n)=>formatCurrency(n),
  };
}
</script>
{% endblock %}
