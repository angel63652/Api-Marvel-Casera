{% extends "base.html" %}
{% block title %}Camiones — WMS Almacén{% endblock %}
{% block page_title %}Gestión de Camiones{% endblock %}

{% block content %}
<div x-data="trucksData()" x-init="init()">

  <!-- Tabs -->
  <div class="flex gap-1 mb-6 bg-white border border-gray-200 rounded-lg p-1 w-fit">
    <button @click="setTab('fleet')" :class="tab==='fleet' ? 'bg-blue-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'"
            class="px-4 py-1.5 rounded-md text-sm font-medium transition-all">Flota</button>
    <button @click="setTab('schedule')" :class="tab==='schedule' ? 'bg-blue-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'"
            class="px-4 py-1.5 rounded-md text-sm font-medium transition-all">Programación</button>
    <button @click="setTab('history')" :class="tab==='history' ? 'bg-blue-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'"
            class="px-4 py-1.5 rounded-md text-sm font-medium transition-all">Histórico</button>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex justify-center py-12"><div class="spinner"></div></div>

  <!-- ===================== FLEET TAB ===================== -->
  <div x-show="!loading && tab === 'fleet'">
    <div class="flex justify-end mb-4">
      <button @click="openTruckModal()" class="flex items-center gap-2 px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold rounded-lg transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Añadir Camión
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-if="!trucks.length">
        <div class="card text-center py-12 text-gray-400 col-span-full">No hay camiones registrados</div>
      </template>
      <template x-for="truck in trucks" :key="truck.id">
        <div class="card card-hover">
          <div class="flex items-start justify-between mb-3">
            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
              <svg class="w-6 h-6 text-blue-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/>
              </svg>
            </div>
            <span x-html="statusBadge(truck.status)"></span>
          </div>
          <h3 class="font-bold text-gray-900 text-lg" x-text="truck.plate"></h3>
          <p class="text-gray-600 text-sm" x-text="(truck.brand || '') + ' ' + (truck.model || '')"></p>
          <div class="mt-3 pt-3 border-t border-gray-100 space-y-1.5 text-sm">
            <div class="flex justify-between">
              <span class="text-gray-500">Conductor</span>
              <span class="font-medium text-gray-800" x-text="truck.driver_name || '—'"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">Capacidad</span>
              <span class="font-medium text-gray-800" x-text="(truck.capacity_kg || '—') + ' kg'"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">Año</span>
              <span class="font-medium text-gray-800" x-text="truck.year || '—'"></span>
            </div>
          </div>
          <div class="flex gap-2 mt-4">
            <button @click="editTruck(truck)" class="flex-1 py-2 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors">Editar</button>
            <button @click="deleteTruck(truck.id)" class="px-3 py-2 text-xs font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">Eliminar</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===================== SCHEDULE TAB ===================== -->
  <div x-show="!loading && tab === 'schedule'">
    <!-- View controls -->
    <div class="flex flex-wrap items-center gap-3 mb-5">
      <div class="flex bg-white border border-gray-200 rounded-lg p-1">
        <button @click="scheduleView='day'" :class="scheduleView==='day' ? 'bg-blue-700 text-white' : 'text-gray-600 hover:bg-gray-100'"
                class="px-3 py-1 rounded text-xs font-semibold transition-all">Día</button>
        <button @click="scheduleView='week'" :class="scheduleView==='week' ? 'bg-blue-700 text-white' : 'text-gray-600 hover:bg-gray-100'"
                class="px-3 py-1 rounded text-xs font-semibold transition-all">Semana</button>
        <button @click="scheduleView='month'" :class="scheduleView==='month' ? 'bg-blue-700 text-white' : 'text-gray-600 hover:bg-gray-100'"
                class="px-3 py-1 rounded text-xs font-semibold transition-all">Mes</button>
      </div>
      <input type="date" class="form-input w-auto" x-model="scheduleDate" @change="fetchSchedules()">
      <button @click="openScheduleModal()" class="flex items-center gap-2 px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold rounded-lg transition-colors ml-auto">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Nueva Programación
      </button>
    </div>

    <!-- Schedule Cards -->
    <div class="space-y-3">
      <template x-if="!schedules.length">
        <div class="card text-center py-12 text-gray-400">
          <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          No hay programaciones para este período
        </div>
      </template>
      <template x-for="sched in schedules" :key="sched.id">
        <div class="truck-card" :class="sched.status">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5">
                <svg class="w-5 h-5 text-blue-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"/></svg>
              </div>
              <div>
                <p class="font-bold text-gray-900" x-text="(sched.truck_plate || '—') + ' · ' + (sched.driver_name || 'Sin conductor')"></p>
                <p class="text-sm text-gray-600 mt-0.5" x-text="sched.route || 'Ruta no especificada'"></p>
                <div class="flex flex-wrap gap-3 mt-1.5 text-xs text-gray-500">
                  <span x-show="sched.departure_time">🕐 <span x-text="sched.departure_time"></span></span>
                  <span x-show="sched.estimated_cost">💶 <span x-text="formatCurrency(sched.estimated_cost)"></span></span>
                  <span x-show="sched.orders_count">📦 <span x-text="sched.orders_count + ' orden(es)'"></span></span>
                </div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-2">
              <span x-html="statusBadge(sched.status)"></span>
              <div class="flex gap-1.5">
                <button @click="editSchedule(sched)" class="px-2 py-1 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition-colors">Editar</button>
                <button @click="updateScheduleStatus(sched.id, 'COMPLETED')" x-show="statusKey(sched.status)==='scheduled'" class="px-2 py-1 text-xs font-medium text-green-700 bg-green-50 hover:bg-green-100 rounded transition-colors">Completado</button>
                <button @click="deleteSchedule(sched.id)" class="px-2 py-1 text-xs font-medium text-red-700 bg-red-50 hover:bg-red-100 rounded transition-colors">Eliminar</button>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===================== HISTORY TAB ===================== -->
  <div x-show="!loading && tab === 'history'">
    <!-- Filters & Export -->
    <div class="flex flex-wrap items-center gap-3 mb-5">
      <input type="date" class="form-input w-auto" x-model="historyFrom" @change="fetchHistory()" title="Desde">
      <input type="date" class="form-input w-auto" x-model="historyTo" @change="fetchHistory()" title="Hasta">
      <button @click="exportExcel()" class="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-lg transition-colors ml-auto">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Exportar Excel
      </button>
    </div>

    <!-- Summary Stats -->
    <div class="grid grid-cols-3 gap-4 mb-5">
      <div class="card text-center">
        <p class="text-2xl font-bold text-blue-700" x-text="historyStats.total_trips || 0"></p>
        <p class="text-xs text-gray-500 mt-1">Total viajes</p>
      </div>
      <div class="card text-center">
        <p class="text-2xl font-bold text-green-700" x-text="formatCurrency(historyStats.total_cost || 0)"></p>
        <p class="text-xs text-gray-500 mt-1">Coste total</p>
      </div>
      <div class="card text-center">
        <p class="text-2xl font-bold text-indigo-700" x-text="formatCurrency(historyStats.avg_cost || 0)"></p>
        <p class="text-xs text-gray-500 mt-1">Coste medio/viaje</p>
      </div>
    </div>

    <!-- History Table -->
    <div class="card p-0 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="responsive-table w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Fecha</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Camión</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide hidden md:table-cell">Conductor</th>
              <th class="text-left px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide hidden lg:table-cell">Ruta</th>
              <th class="text-right px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Coste</th>
              <th class="text-center px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wide">Estado</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <template x-if="!history.length">
              <tr><td colspan="6" class="py-12 text-center text-gray-400">No hay historial en este período</td></tr>
            </template>
            <template x-for="h in history" :key="h.id">
              <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 text-xs text-gray-600" data-label="Fecha" x-text="formatDate(h.scheduled_date)"></td>
                <td class="px-4 py-3 font-mono font-semibold text-sm" data-label="Camión" x-text="h.truck_plate"></td>
                <td class="px-4 py-3 text-gray-700 hidden md:table-cell" data-label="Conductor" x-text="h.driver_name || '—'"></td>
                <td class="px-4 py-3 text-gray-700 hidden lg:table-cell" data-label="Ruta" x-text="h.route || '—'"></td>
                <td class="px-4 py-3 text-right font-semibold text-gray-800" data-label="Coste" x-text="formatCurrency(h.actual_cost || h.estimated_cost || 0)"></td>
                <td class="px-4 py-3 text-center" data-label="Estado" x-html="statusBadge(h.status)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===== MODAL: Add/Edit Truck ===== -->
  <div x-show="showTruckModal" class="modal-backdrop" @click.self="showTruckModal=false" style="display:none;">
    <div class="modal-box max-w-lg w-full" x-transition>
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <h2 class="text-lg font-semibold" x-text="editTruckId ? 'Editar Camión' : 'Añadir Camión'"></h2>
        <button @click="showTruckModal=false" class="text-gray-400 hover:text-gray-600"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <form @submit.prevent="saveTruck()" class="px-6 py-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Matrícula *</label>
            <input type="text" class="form-input" x-model="truckForm.plate" placeholder="1234 ABC" required>
          </div>
          <div>
            <label class="form-label">Estado</label>
            <select class="form-input" x-model="truckForm.status">
              <option value="active">Activo</option>
              <option value="inactive">Inactivo</option>
              <option value="maintenance">En mantenimiento</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Marca</label>
            <input type="text" class="form-input" x-model="truckForm.brand" placeholder="Mercedes, Volvo…">
          </div>
          <div>
            <label class="form-label">Modelo</label>
            <input type="text" class="form-input" x-model="truckForm.model" placeholder="Actros, FH…">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Año</label>
            <input type="number" class="form-input" x-model.number="truckForm.year" min="1990" :max="new Date().getFullYear()+1" placeholder="2020">
          </div>
          <div>
            <label class="form-label">Capacidad (kg)</label>
            <input type="number" class="form-input" x-model.number="truckForm.capacity_kg" min="0" placeholder="20000">
          </div>
        </div>
        <div>
          <label class="form-label">Conductor habitual</label>
          <select class="form-input" x-model="truckForm.driver_id">
            <option value="">Sin conductor asignado</option>
            <template x-for="emp in employees" :key="emp.id">
              <option :value="emp.id" x-text="emp.full_name"></option>
            </template>
          </select>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" @click="showTruckModal=false" class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
          <button type="submit" :disabled="submitting" class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 rounded-lg disabled:opacity-60 flex items-center justify-center gap-2">
            <div x-show="submitting" class="spinner spinner-sm border-white border-t-transparent"></div>
            <span x-text="editTruckId ? 'Guardar' : 'Añadir'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL: Create/Edit Schedule ===== -->
  <div x-show="showScheduleModal" class="modal-backdrop" @click.self="showScheduleModal=false" style="display:none;">
    <div class="modal-box max-w-lg w-full" x-transition>
      <div class="flex items-center justify-between px-6 py-4 border-b">
        <h2 class="text-lg font-semibold" x-text="editScheduleId ? 'Editar Programación' : 'Nueva Programación'"></h2>
        <button @click="showScheduleModal=false" class="text-gray-400 hover:text-gray-600"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <form @submit.prevent="saveSchedule()" class="px-6 py-4 space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Camión *</label>
            <select class="form-input" x-model="schedForm.truck_id" required>
              <option value="">Seleccionar camión</option>
              <template x-for="t in trucks.filter(t=>t.status==='active')" :key="t.id">
                <option :value="t.id" x-text="t.plate + ' — ' + (t.brand||'') + ' ' + (t.model||'')"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="form-label">Conductor *</label>
            <select class="form-input" x-model="schedForm.driver_id" required>
              <option value="">Seleccionar conductor</option>
              <template x-for="emp in employees" :key="emp.id">
                <option :value="emp.id" x-text="emp.full_name"></option>
              </template>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Fecha *</label>
            <input type="date" class="form-input" x-model="schedForm.scheduled_date" required>
          </div>
          <div>
            <label class="form-label">Hora de salida</label>
            <input type="time" class="form-input" x-model="schedForm.departure_time">
          </div>
        </div>
        <div>
          <label class="form-label">Ruta / Destino</label>
          <input type="text" class="form-input" x-model="schedForm.route" placeholder="Destino o descripción de ruta">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Coste estimado (€)</label>
            <input type="number" class="form-input" x-model.number="schedForm.estimated_cost" min="0" step="0.01" placeholder="0.00">
          </div>
          <div>
            <label class="form-label">Estado</label>
            <select class="form-input" x-model="schedForm.status">
              <option value="SCHEDULED">Programado</option>
              <option value="IN_ROUTE">En ruta</option>
              <option value="COMPLETED">Completado</option>
              <option value="CANCELLED">Cancelado</option>
            </select>
          </div>
        </div>
        <div>
          <label class="form-label">Notas</label>
          <textarea class="form-input" x-model="schedForm.notes" rows="2" placeholder="Instrucciones o notas…"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" @click="showScheduleModal=false" class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Cancelar</button>
          <button type="submit" :disabled="submitting" class="flex-1 px-4 py-2.5 text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 rounded-lg disabled:opacity-60 flex items-center justify-center gap-2">
            <div x-show="submitting" class="spinner spinner-sm border-white border-t-transparent"></div>
            <span x-text="editScheduleId ? 'Guardar' : 'Crear'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function trucksData() {
  return {
    loading: true, submitting: false,
    tab: 'fleet', scheduleView: 'week',
    trucks: [], schedules: [], history: [], employees: [],
    showTruckModal: false, showScheduleModal: false,
    editTruckId: null, editScheduleId: null,
    truckForm: { plate: '', brand: '', model: '', year: '', capacity_kg: '', status: 'active', driver_id: '' },
    schedForm: { truck_id: '', driver_id: '', scheduled_date: '', departure_time: '', route: '', estimated_cost: '', status: 'SCHEDULED', notes: '' },
    scheduleDate: new Date().toISOString().slice(0,10),
    historyFrom: '', historyTo: '',
    historyStats: { total_trips: 0, total_cost: 0, avg_cost: 0 },

    async init() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('tab')) this.tab = params.get('tab');
      this.historyFrom = new Date(Date.now() - 30*24*60*60*1000).toISOString().slice(0,10);
      this.historyTo = new Date().toISOString().slice(0,10);
      this.loading = true;
      await Promise.all([this.fetchTrucks(), this.fetchEmployees()]);
      if (this.tab === 'schedule') await this.fetchSchedules();
      if (this.tab === 'history') await this.fetchHistory();
      this.loading = false;
    },

    setTab(t) {
      this.tab = t; this.loading = true;
      const p = { fleet: this.fetchTrucks(), schedule: this.fetchSchedules(), history: this.fetchHistory() }[t];
      (p || Promise.resolve()).then(() => this.loading = false);
    },

    async fetchTrucks() {
      try { const data = await api('GET', '/trucks'); this.trucks = (data.items || data || []).map(t => this.normalizeTruck(t)); } catch (_) {}
    },
    async fetchSchedules() {
      try {
        const data = await api('GET', '/trucks/schedules');
        this.schedules = (data.items || data || []).map(s => this.normalizeSchedule(s));
      } catch (_) {}
    },
    async fetchHistory() {
      try {
        const params = new URLSearchParams();
        if (this.historyFrom) params.set('start_date', `${this.historyFrom}T00:00:00`);
        if (this.historyTo) params.set('end_date', `${this.historyTo}T23:59:59`);
        const data = await api('GET', `/trucks/schedules/history?${params}`);
        this.history = (data.schedules || data.items || data || []).map(s => this.normalizeSchedule(s));
        this.historyStats = data.stats || { total_trips: this.history.length, total_cost: this.history.reduce((s,h)=>s+(h.actual_cost||h.estimated_cost||0),0), avg_cost: 0 };
        if (this.history.length) this.historyStats.avg_cost = this.historyStats.total_cost / this.history.length;
      } catch (_) {}
    },
    async fetchEmployees() {
      try { const data = await api('GET', '/employees?page_size=100'); this.employees = data.items || data || []; } catch (_) {}
    },

    normalizeTruck(t) {
      return { ...t, model: t.model_name || t.model || '', status: t.is_active === false ? 'inactive' : 'active' };
    },
    normalizeSchedule(s) {
      return { ...s, scheduled_date: (s.date || '').slice(0, 10), route: s.route_description || s.route || '', status: statusKey(s.status) };
    },
    truckPayload() {
      return {
        plate: this.truckForm.plate,
        brand: this.truckForm.brand || '',
        model_name: this.truckForm.model || '',
        capacity_kg: this.truckForm.capacity_kg || null,
        driver_id: this.truckForm.driver_id || null,
        is_active: this.truckForm.status !== 'inactive',
      };
    },
    schedulePayload() {
      const date = this.schedForm.scheduled_date || new Date().toISOString().slice(0, 10);
      return {
        truck_id: Number(this.schedForm.truck_id),
        driver_id: this.schedForm.driver_id ? Number(this.schedForm.driver_id) : null,
        date: `${date}T00:00:00`,
        departure_time: this.schedForm.departure_time ? `${date}T${this.schedForm.departure_time}:00` : null,
        route_description: this.schedForm.route || null,
        estimated_cost: this.schedForm.estimated_cost || null,
        status: this.schedForm.status,
        notes: this.schedForm.notes || null,
      };
    },

    openTruckModal() { this.editTruckId=null; this.truckForm={plate:'',brand:'',model:'',year:'',capacity_kg:'',status:'active',driver_id:''}; this.showTruckModal=true; },
    editTruck(t) { this.editTruckId=t.id; this.truckForm={plate:t.plate,brand:t.brand||'',model:t.model||'',year:t.year||'',capacity_kg:t.capacity_kg||'',status:t.status,driver_id:t.driver_id||''}; this.showTruckModal=true; },
    async saveTruck() {
      if(this.submitting)return; this.submitting=true;
      try {
        const payload = this.truckPayload();
        if(this.editTruckId){await api('PUT',`/trucks/${this.editTruckId}`,payload);toast('Camión actualizado','success');}
        else{await api('POST','/trucks',payload);toast('Camión añadido','success');}
        this.showTruckModal=false; await this.fetchTrucks();
      }catch(_){}finally{this.submitting=false;}
    },
    async deleteTruck(id){
      if(!await confirmDialog('¿Eliminar este camión?'))return;
      try{await api('PUT',`/trucks/${id}`,{is_active:false});toast('Camión desactivado','success');await this.fetchTrucks();}catch(_){}
    },

    openScheduleModal(){ this.editScheduleId=null; const today=new Date().toISOString().slice(0,10); this.schedForm={truck_id:'',driver_id:'',scheduled_date:today,departure_time:'08:00',route:'',estimated_cost:'',status:'SCHEDULED',notes:''}; this.showScheduleModal=true; },
    editSchedule(s){ const st={scheduled:'SCHEDULED',in_route:'IN_ROUTE',completed:'COMPLETED',cancelled:'CANCELLED'}[statusKey(s.status)] || 'SCHEDULED'; this.editScheduleId=s.id; this.schedForm={truck_id:s.truck_id||'',driver_id:s.driver_id||'',scheduled_date:s.scheduled_date,departure_time:(s.departure_time||'').slice(11,16),route:s.route||'',estimated_cost:s.estimated_cost||'',status:st,notes:s.notes||''}; this.showScheduleModal=true; },
    async saveSchedule(){
      if(this.submitting)return; this.submitting=true;
      try{
        const payload = this.schedulePayload();
        if(this.editScheduleId){await api('PUT',`/trucks/schedules/${this.editScheduleId}`,payload);toast('Programación actualizada','success');}
        else{await api('POST','/trucks/schedules',payload);toast('Programación creada','success');}
        this.showScheduleModal=false;await this.fetchSchedules();
      }catch(_){}finally{this.submitting=false;}
    },
    async updateScheduleStatus(id,status){
      try{
        if(status === 'COMPLETED') await api('POST',`/trucks/schedules/${id}/complete`,{});
        else await api('PUT',`/trucks/schedules/${id}`,{status});
        toast('Estado actualizado','success');await this.fetchSchedules();
      }catch(_){}
    },
    async deleteSchedule(id){
      if(!await confirmDialog('¿Eliminar esta programación?'))return;
      try{await api('PUT',`/trucks/schedules/${id}`,{status:'CANCELLED'});toast('Programación cancelada','success');await this.fetchSchedules();}catch(_){}
    },

    async exportExcel(){
      try{
        const params = new URLSearchParams();
        if (this.historyFrom) params.set('start_date', `${this.historyFrom}T00:00:00`);
        if (this.historyTo) params.set('end_date', `${this.historyTo}T23:59:59`);
        const query = params.toString();
        const suffix = `${this.historyFrom || 'inicio'}_${this.historyTo || 'fin'}`;
        await downloadFile(`/trucks/schedules/history/export${query ? `?${query}` : ''}`, `historico_camiones_${suffix}.xlsx`);
        toast('Exportacion iniciada', 'success');
      }catch(_){}
    },

    statusBadge:(s)=>statusBadge(s),
    formatDate:(iso)=>formatDate(iso),
    formatCurrency:(n)=>formatCurrency(n),
  };
}
</script>
{% endblock %}
