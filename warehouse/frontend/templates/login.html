<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <title>Acceso — WMS Almacén</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center p-4">

<div id="toast-container"></div>

<div class="w-full max-w-sm">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-white/15 rounded-2xl mb-4 shadow-lg">
      <svg class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 10V7"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-white tracking-tight">WMS Almacén</h1>
    <p class="text-blue-200 text-sm mt-1">Distrigal SL</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-2xl p-8">
    <h2 class="text-xl font-semibold text-gray-900 mb-1">Iniciar sesión</h2>
    <p class="text-sm text-gray-500 mb-6">Introduce tus credenciales de acceso</p>

    <form id="login-form" novalidate>
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Correo electrónico</label>
        <input
          id="email" name="email" type="email" autocomplete="email" required
          placeholder="admin@distrigal.com"
          class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-gray-900 text-sm placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        >
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
        <div class="relative">
          <input
            id="password" name="password" type="password" autocomplete="current-password" required
            placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-gray-900 text-sm placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition pr-10"
          >
          <button type="button" id="toggle-pw"
                  class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-gray-600 transition">
            <svg id="eye-icon" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error message -->
      <div id="error-msg" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg flex items-start gap-2">
        <svg class="w-4 h-4 text-red-500 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span id="error-text" class="text-sm text-red-700"></span>
      </div>

      <!-- Submit -->
      <button type="submit" id="submit-btn"
              class="w-full py-2.5 px-4 bg-blue-700 hover:bg-blue-800 active:bg-blue-900
                     text-white font-semibold rounded-lg text-sm transition
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
                     disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span id="btn-text">Entrar</span>
        <svg id="btn-spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
      </button>
    </form>
  </div>

  <p class="text-center text-blue-300 text-xs mt-6">
    WMS Almacén v1.0 &mdash; Distrigal SL
  </p>
</div>

<script>
  // If already logged in, go to dashboard.
  if (localStorage.getItem('wms_token')) {
    window.location.replace('/');
  }

  const form    = document.getElementById('login-form');
  const errBox  = document.getElementById('error-msg');
  const errText = document.getElementById('error-text');
  const btn     = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('btn-spinner');

  function showError(msg) {
    errText.textContent = msg;
    errBox.classList.remove('hidden');
    errBox.classList.add('flex');
  }
  function hideError() {
    errBox.classList.add('hidden');
    errBox.classList.remove('flex');
  }
  function setLoading(on) {
    btn.disabled = on;
    btnText.textContent = on ? 'Verificando…' : 'Entrar';
    spinner.classList.toggle('hidden', !on);
  }

  // Toggle password visibility.
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Introduce tu correo y contraseña.');
      return;
    }

    setLoading(true);
    try {
      const res = await fetch('/api/v1/employees/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        const msg = data.detail || 'Credenciales incorrectas. Inténtalo de nuevo.';
        showError(msg);
        return;
      }

      // Persist auth.
      localStorage.setItem('wms_token', data.access_token);
      if (data.refresh_token) localStorage.setItem('wms_refresh', data.refresh_token);
      else localStorage.removeItem('wms_refresh');
      localStorage.setItem('wms_user',  JSON.stringify(data.employee));

      // Go to dashboard.
      window.location.replace('/');

    } catch {
      showError('No se puede conectar con el servidor. Comprueba tu conexión.');
    } finally {
      setLoading(false);
    }
  });

  // Autofocus.
  document.getElementById('email').focus();
</script>
</body>
</html>
