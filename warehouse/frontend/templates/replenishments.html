{% extends "base.html" %}
{% block title %}Reposiciones — WMS Almacén{% endblock %}
{% block page_title %}Reposiciones{% endblock %}

{% block content %}
<div x-data="replenishmentsData()" x-init="init()">

  <!-- Header Bar -->
  <div class="flex flex-wrap items-center gap-3 mb-6">
    <button @click="autoGenerate()" :disabled="autoGenerating"
            class="flex items-center gap-2 px-4 py-2 bg-indigo-700 hover:bg-indigo-800 text-white text-sm font-semibold rounded-lg transition-colors disabled:opacity-60">
      <svg class="w-4 h-4" :class="{'animate-spin': autoGenerating}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      <span x-text="autoGenerating ? 'Generando…' : 'Auto-generar desde stock bajo'"></span>
    </button>

    <!-- Priority filter -->
    <div class="flex items-center gap-1 bg-white border border-gray-200 rounded-lg p-1">
      <button @click="filterPriority=''" :class="filterPriority==='' ? 'bg-gray-800 text-white' : 'text-gray-600 hover:bg-gray-100'"
              class="px-3 py-1 rounded text-xs font-semibold transition-all">Todas</button>
      <button @click="filterPriority='HIGH'" :class="filterPriority==='HIGH' ? 'bg-red-600 text-white' : 'text-gray-600 hover:bg-gray-100'"
              class="px-3 py-1 rounded text-xs font-semibold transition-all">Alta</button>
      <button @click="filterPriority='MEDIUM'" :class="filterPriority==='MEDIUM' ? 'bg-amber-500 text-white' : 'text-gray-600 hover:bg-gray-100'"
              class="px-3 py-1 rounded text-xs font-semibold transition-all">Media</button>
      <button @click="filterPriority='LOW'" :class="filterPriority==='LOW' ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100'"
              class="px-3 py-1 rounded text-xs font-semibold transition-all">Baja</button>
    </div>

    <select class="form-input w-auto" x-model="filterStatus" @change="fetchReplenishments()">
      <option value="">Todos los estados</option>
      <option value="PENDING">Pendiente</option>
      <option value="IN_PROGRESS">En progreso</option>
      <option value="COMPLETED">Completado</option>
    </select>

    <div class="ml-auto text-sm text-gray-500">
      <span x-text="filtered.length + ' reposiciones'"></span>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex justify-center py-12"><div class="spinner"></div></div>

  <!-- List -->
  <div x-show="!loading" class="space-y-4">
    <template x-if="!filtered.length">
      <div class="card text-center py-12 text-gray-400">
        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        No hay reposiciones
      </div>
    </template>

    <template x-for="rep in filtered" :key="rep.id">
      <div class="card">
        <!-- Replenishment header -->
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-mono text-sm font-bold text-blue-700" x-text="rep.reference || '#' + rep.id"></span>
              <span x-html="priorityBadge(rep.priority)"></span>
              <span x-html="statusBadge(rep.status)"></span>
            </div>
            <p class="text-xs text-gray-500" x-text="'Creada: ' + formatDate(rep.created_at) + (rep.supplier ? ' · Proveedor: ' + rep.supplier : '')"></p>
          </div>
          <div class="flex gap-2">
            <button @click="toggleDetail(rep.id)" class="flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" :d="openDetails.includes(rep.id) ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7'"/>
              </svg>
              <span x-text="openDetails.includes(rep.id) ? 'Ocultar' : 'Ver líneas'"></span>
            </button>
          </div>
        </div>

        <!-- Lines (collapsible) -->
        <div x-show="openDetails.includes(rep.id)" x-collapse>
          <div class="border-t border-gray-100 pt-4">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-gray-100">
                  <th class="text-left py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Producto</th>
                  <th class="text-right py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Stock actual</th>
                  <th class="text-right py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Mínimo</th>
                  <th class="text-right py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Pedir</th>
                  <th class="text-right py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Recibido</th>
                  <th class="text-center py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Estado</th>
                  <th class="text-center py-2 font-semibold text-gray-500 text-xs uppercase tracking-wide">Acción</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="line in (rep.lines || [])" :key="line.id">
                  <tr class="border-b border-gray-50 hover:bg-gray-50">
                    <td class="py-2.5">
                      <p class="font-medium" x-text="line.product_name"></p>
                      <p class="text-xs font-mono text-gray-400" x-text="line.product_niu"></p>
                    </td>
                    <td class="py-2.5 text-right" :class="line.current_stock <= line.minimum_stock ? 'text-red-600 font-bold' : ''" x-text="line.current_stock"></td>
                    <td class="py-2.5 text-right text-gray-500" x-text="line.minimum_stock"></td>
                    <td class="py-2.5 text-right font-semibold text-blue-700" x-text="line.quantity_to_order"></td>
                    <td class="py-2.5 text-right">
                      <input type="number" class="form-input w-20 text-sm text-center" x-model.number="line._received"
                             :placeholder="line.quantity_received || 0" min="0" :max="line.quantity_to_order"
                             x-show="line.status !== 'received'" @click.stop>
                      <span x-show="line.status === 'received'" class="text-green-600 font-semibold" x-text="line.quantity_received"></span>
                    </td>
                    <td class="py-2.5 text-center" x-html="repLineStatusBadge(line.status)"></td>
                    <td class="py-2.5 text-center">
                      <button x-show="line.status !== 'received'"
                              @click="markLineReceived(rep.id, line)"
                              class="px-3 py-1 text-xs font-semibold text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors">
                        Recibido
                      </button>
                      <span x-show="line.status === 'received'" class="text-xs text-gray-400">✓ OK</span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="flex justify-end mt-3" x-show="rep.lines && rep.lines.some(l => l.status !== 'received')">
              <button @click="markAllReceived(rep)" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-green-700 bg-green-50 hover:bg-green-100 border border-green-200 rounded-lg transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                Marcar todo como recibido
              </button>
            </div>
          </div>
        </div>

        <!-- Summary stats -->
        <div class="flex gap-4 text-xs text-gray-500 mt-2" x-show="!openDetails.includes(rep.id)">
          <span x-text="(rep.lines||[]).length + ' línea(s)'"></span>
          <span x-text="(rep.lines||[]).filter(l=>l.status==='received').length + ' recibidas'"></span>
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function replenishmentsData() {
  return {
    loading: true, autoGenerating: false,
    replenishments: [], filterPriority: '', filterStatus: '',
    openDetails: [],

    get filtered() {
      return this.replenishments.filter(r => {
        if (this.filterPriority && r.priority !== this.filterPriority) return false;
        if (this.filterStatus && r.status !== this.filterStatus) return false;
        return true;
      });
    },

    async init() { await this.fetchReplenishments(); },

    async fetchReplenishments() {
      this.loading = true;
      try {
        const params = new URLSearchParams();
        if (this.filterStatus) params.set('status', this.filterStatus);
        if (this.filterPriority) params.set('priority', this.filterPriority);
        const data = await api('GET', `/replenishments?${params}`);
        this.replenishments = (data.items || data || []).map(rep => this.normalizeReplenishment(rep));
      } catch (_) {} finally { this.loading = false; }
    },

    normalizeReplenishment(rep) {
      return {
        ...rep,
        lines: (rep.lines || []).map(line => {
          const requested = Number(line.requested_qty ?? line.quantity_to_order ?? 0);
          const received = Number(line.received_qty ?? line.quantity_received ?? 0);
          return {
            ...line,
            product_niu: line.product_niu || line.product_barcode || '',
            current_stock: Number(line.current_qty ?? line.current_stock ?? 0),
            minimum_stock: Number(line.min_qty ?? line.minimum_stock ?? 0),
            quantity_to_order: requested,
            quantity_received: received,
            _received: received || requested,
            status: this.lineStatus(received, requested),
          };
        }),
      };
    },

    lineStatus(received, requested) {
      if (requested > 0 && received >= requested) return 'received';
      if (received > 0) return 'partial';
      return 'pending';
    },

    replaceReplenishment(updated) {
      const normalized = this.normalizeReplenishment(updated);
      const index = this.replenishments.findIndex(rep => rep.id === normalized.id);
      if (index === -1) this.replenishments.unshift(normalized);
      else this.replenishments.splice(index, 1, normalized);
      return normalized;
    },

    async autoGenerate() {
      this.autoGenerating = true;
      try {
        const result = await api('POST', '/replenishments/auto-generate');
        const count = result?.created || (Array.isArray(result) ? result.length : (result?.id ? 1 : 0));
        toast(`${count} reposición(es) generada(s) automáticamente`, 'success');
        await this.fetchReplenishments();
      } catch (_) {} finally { this.autoGenerating = false; }
    },

    toggleDetail(id) {
      const idx = this.openDetails.indexOf(id);
      if (idx === -1) this.openDetails.push(id);
      else this.openDetails.splice(idx, 1);
    },

    async markLineReceived(repId, line) {
      const qty = line._received ?? line.quantity_to_order;
      try {
        const updated = await api('POST', `/replenishments/${repId}/lines/${line.id}/receive?received_qty=${encodeURIComponent(qty)}`);
        this.replaceReplenishment(updated);
        toast('Línea marcada como recibida', 'success');
        this.checkReplenishmentComplete(repId);
      } catch (_) {}
    },

    async markAllReceived(rep) {
      for (const line of rep.lines || []) {
        if (line.status !== 'received') {
          const qty = line._received ?? line.quantity_to_order;
          try {
            const updated = await api('POST', `/replenishments/${rep.id}/lines/${line.id}/receive?received_qty=${encodeURIComponent(qty)}`);
            rep = this.replaceReplenishment(updated);
          } catch (_) {}
        }
      }
      toast('Todas las líneas marcadas como recibidas', 'success');
      this.checkReplenishmentComplete(rep.id);
    },

    checkReplenishmentComplete(repId) {
      const rep = this.replenishments.find(r => r.id === repId);
      if (rep && rep.lines && rep.lines.every(l => l.status === 'received')) {
        rep.status = 'COMPLETED';
      }
    },

    priorityBadge(p) {
      const map = { HIGH: ['badge-high','Alta'], MEDIUM: ['badge-medium','Media'], LOW: ['badge-low-p','Baja'] };
      const [cls, lbl] = map[p] || ['badge-draft', p];
      return `<span class="badge ${cls}">${lbl}</span>`;
    },
    statusBadge: (s) => statusBadge(s),
    repLineStatusBadge(s) {
      if (s === 'received') return '<span class="badge badge-completed">Recibido</span>';
      if (s === 'partial') return '<span class="badge badge-returned">Parcial</span>';
      return '<span class="badge badge-pending">Pendiente</span>';
    },
    formatDate: (iso) => formatDate(iso),
  };
}
</script>
{% endblock %}
